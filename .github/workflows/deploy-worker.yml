name: Deploy remote server to Cloudflare Workers

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    # フォークではデプロイ先の Secrets がなく失敗するだけなので、本リポジトリに限る。
    # workflow_dispatch は main ブランチからのみ許可する（誤ブランチでのデプロイを防ぐ）
    if: >
      github.repository == 'nonz250/ai-rotom' &&
      (github.event_name == 'release' ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    # Cloudflare の API トークンはこの Environment の Secrets にだけ置く。
    # npm 公開用の production とは分け、片方の権限がもう片方のジョブに渡らないようにする。
    environment:
      name: cloudflare-workers
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p packages/remote-server/tsconfig.json

      - name: Run tests
        run: npm test

      - name: Bundle Cloudflare Worker
        run: npm run bundle --workspace=@ai-rotom/remote-server
        env:
          WRANGLER_SEND_METRICS: "false"

      - name: Verify worker bundle has no Node.js built-in imports
        run: bash scripts/verify-worker-bundle.sh

      - name: Deploy
        run: npm run deploy --workspace=@ai-rotom/remote-server
        env:
          WRANGLER_SEND_METRICS: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
