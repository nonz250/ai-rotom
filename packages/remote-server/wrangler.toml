name = "ai-rotom"
main = "src/platforms/cloudflare.ts"
compatibility_date = "2026-11-01"

[vars]
# 全技系ツールで自分側の技構成を必須にするか。有料プランなど CPU 時間に余裕がある環境では "false" にできる。
# ダッシュボードで変えた値はデプロイのたびにここの値で上書きされるので、変えるときはこのファイルを書き換える。
REQUIRE_MOVES = "true"
# 受け付けるホスト名をカンマ区切りで書く。ポートは書かない。未設定ならホスト名を確かめない。
# 既定で有効にしないのは、workers.dev のサブドメインがアカウントごとに違い、ここに書いておけないため。
# ALLOWED_HOSTS = "ai-rotom.<サブドメイン>.workers.dev"

# リクエストを 60 秒あたり 60 件までにする。認証ありならトークンごと、ALLOW_ANONYMOUS なら接続元のアドレスごとに数える。
# MCP のメッセージ 1 つで 1 件使い、会話のなかで続けて呼んでも 1 秒に 1 件を超えることはまずない。
# 認証ありならトークンは 1 つなので、上限で使い続けても 1 日 86,400 件で、無料プランの 1 日 100,000 件に収まる。
# 認証なしではアドレスの数だけ枠ができるので、この制限では 1 日の上限を守れない。
# 数え方はロケーションごとの近似なので、多少は超えることがある。
# period は 10 か 60 しか指定できない。変えたら src/platforms/cloudflare.ts の RATE_LIMIT_PERIOD_SECONDS も合わせる。
# namespace_id はアカウント内で一意の整数。同じアカウントの別の Worker と同じ値にすると数が共有される。
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
